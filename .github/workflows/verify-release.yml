name: verify-release

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Import release public key
        run: gpg --batch --import keys/Uwohali_Tuccio_0x8C8CB0D48C7F60DA_public.asc
      - name: Verify manifest and detached signatures
        shell: bash
        run: |
          set -euo pipefail
          cd releases/v1.1.2-genesis
          sha256sum -c SHA256_SUMS.txt
          while IFS= read -r -d '' signature; do
            target="${signature%.asc}"
            if [[ -f "$target" ]]; then
              gpg --batch --verify "$signature" "$target"
            fi
          done < <(find . -type f -name '*.asc' -print0)
      - name: Verify claims registry mapping-only v0.1
        shell: bash
        run: |
          set -euo pipefail
          cd registries/claims/v0.1-mapping-only
          sha256sum -c SHA256SUMS.txt
          for f in ADMISSION_RECEIPT.md claims-registry.v0.1-mapping-only.json claims-registry-snapshot.schema.json REGISTRY_MANIFEST.md SHA256SUMS.txt; do
            gpg --batch --verify "$f.asc" "$f"
          done
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('claims-registry.v0.1-mapping-only.json').read_text())
          assert r['status']=='FROZEN_SIGNED_MAPPING_ONLY'
          assert r['counts']=={'source_claims':12,'admitted_mapping_only':8,'holds':4}
          ids={x['source_claim_id'] for x in r['source_claims'] if x['mapping_status']=='hold'}
          assert ids=={'C-002','C-005','C-008','C-009'}
          u=[x['claim_uid'] for x in r['source_claims'] if x['mapping_status']=='admitted_mapping_only']
          assert len(u)==8 and len(set(u))==8 and all(u)
          PY
      - name: Verify v1.1.4-full-corpus-pdf signed manifests
        shell: bash
        run: |
          set -euo pipefail
          cd releases/v1.1.4-full-corpus-pdf
          for f in RELEASE_MANIFEST.md SHA256SUMS.txt; do
            gpg --batch --verify "$f.asc" "$f"
          done
          ls assets/*.asc >/dev/null

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Gitleaks verified binary
        shell: bash
        run: |
          set -euo pipefail
          VER=8.21.2
          ARCHIVE="gitleaks_${VER}_linux_x64.tar.gz"
          curl --fail --location --silent --show-error \
            --output "$ARCHIVE" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/${ARCHIVE}"
          echo "5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba  $ARCHIVE" \
            | sha256sum --check
          tar -xzf "$ARCHIVE" gitleaks
          ./gitleaks detect --no-git --source . --redact
